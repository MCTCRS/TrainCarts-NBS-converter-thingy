<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TrainCarts NBS player thingy</title>

<style>
body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

.container {
    width: 430px;
    white-space: pre;
}

.row {
    display: flex;
    gap: 6px;
    margin-top: 2px;
}

input, button {
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    font-family: "Courier New", monospace;
    padding: 4px;
}

button:hover {
    background: #fff;
    color: #000;
}

#file-input {
    flex: 1;
}

#output {
    flex: 1;
}

.footer-link {
    position: fixed;
    bottom: 6px;
    right: 8px;
    font-size: 12px;
    color: #aaa;
    text-decoration: none;
}

.footer-link:hover {
    color: #fff;
}

</style>
</head>

<body>

<div class="container">

+-------------------------------------------+
|      TrainCarts NBS converter thingy      |
+-------------------------------------------+

Upload datapack-compatible NBS:
<div class="row">
<input id="file-input" type="file">
<button id="convert-btn">CONVERT</button>
</div>
<span style="text-align:center;" id="state"></span>
Output:
<div class="row">
<input id="output" readonly>
<button id="copy-btn">COPY</button>
</div>

<script type="module" src="main.js"></script>

</div>

<a class="footer-link" href="https://github.com/MCTCRS/TrainCarts-NBS-converter-thingy" target="_blank">
    program by The_CommanderRS
</a>

</body>

</html>
