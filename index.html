<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>TrainCarts NBS player thingy</title>

<meta property="og:title" content="TrainCarts NBS converter thingy">
<meta property="og:description" content="Convert NBS (Note Block Studio) files into TrainCarts config.">

<style>
body {
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

.container {
    width: 430px;
    white-space: pre;
}

.row {
    display: flex;
    gap: 6px;
    margin-top: 2px;
}

input, button, select, textarea {
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    font-family: "Courier New", monospace;
}

input, button { padding: 4px; }
select { padding: 1px; }
textarea { padding: 4px; }

button:hover {
    background: #fff;
    color: #000;
}

#file-input {
    flex: 1;
}

#output {
    flex: 1;
}

.footer-link {
    position: fixed;
    bottom: 6px;
    right: 8px;
    font-size: 12px;
    color: #aaa;
    text-decoration: none;
}

.footer-link:hover {
    color: #fff;
}

</style>
</head>

<body>

<div class="container">

+-------------------------------------------+
|      TrainCarts NBS converter thingy      |
+-------------------------------------------+

Upload NBS:
<div class="row">
<input id="file-input" type="file" accept=".nbs">
<button id="convert-btn">CONVERT</button>
</div>
<span style="text-align:center;" id="state"></span>
<div class="row">
<span>Output </span>
<select id="output-type">
    <option value="train">train</option>
    <option value="attachment">attachment</option>
</select>
<label style="display:flex;align-items:center;gap:4px;">
<input type="checkbox" id="upload-url">
<span>as URL</span>
</label>
</div>
<div class="row">
<textarea id="output" rows="3" readonly></textarea>
<button id="copy-btn">COPY</button>
</div>

<script type="module" src="main.js"></script>

</div>

<a class="footer-link" href="https://github.com/MCTCRS/TrainCarts-NBS-converter-thingy" target="_blank">
    program by The_CommanderRS
</a>

</body>
</html>
